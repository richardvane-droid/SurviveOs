# ============================================================
# HomeAssistant 自动化脚本 v2 - 阳光模拟系统四个场景
# 变更（相对原版，对应本次评审 D2/B5 决策）：
#   1. 四个场景全部补全 time trigger，对齐采购清单的场景时间
#      (7:00 / 9:00 / 10:00 / 19:00)
#   2. 灯光控制改为"插座通断为主"：只控制
#      switch.huawei_socket_fs300b 通断，不再调用蓝牙的
#      light.fs300b_light 服务（协议未验证，避免场景卡死在
#      不存在的服务调用上）。亮度/色温改为提前在 NANLINK App
#      里手动预设好、依赖灯具的断电记忆功能保持
#   3. 依赖实体新增：
#        number.slider_target（滑轨，需先手动触发一次
#        button.执行寻零 完成寻零后才会响应）
#        number.gimbal_pitch_angle / yaw_angle / fresnel_angle
#        （云台，需先手动触发一次 button.执行云台寻零）
#        switch.huawei_socket_fs300b
# ============================================================

# ------------------------------------------------------------
# 场景1：早晨唤醒 - 床头位置，大光斑
# ------------------------------------------------------------
- id: sunlight_scene_morning_wakeup
  alias: "阳光模拟-场景1-早晨唤醒"
  description: "滑轨移到床头，灯头下倾30°，大光斑38°；灯光亮度/色温由App断电记忆预设为5000K约50%"
  trigger:
    - platform: state
      entity_id: input_boolean.scene_morning_wakeup
      to: "on"
    - platform: time
      at: "07:00:00"
  condition: []
  action:
    - service: switch.turn_on
      target: {entity_id: switch.huawei_socket_fs300b}
    - delay: "00:00:03"
    - service: number.set_value
      target: {entity_id: number.slider_target}
      data: {value: 0}
    - service: number.set_value
      target: {entity_id: number.gimbal_pitch_angle}
      data: {value: 30}
    - service: number.set_value
      target: {entity_id: number.gimbal_yaw_angle}
      data: {value: 0}
    - service: number.set_value
      target: {entity_id: number.gimbal_fresnel_angle}
      data: {value: 38}
    - service: input_boolean.turn_off
      target: {entity_id: input_boolean.scene_morning_wakeup}
  mode: single

# ------------------------------------------------------------
# 场景2：上午运动 - 运动区域，中光斑
# ------------------------------------------------------------
