  mode: single

# ------------------------------------------------------------
# 全局关闭
# ------------------------------------------------------------
- id: sunlight_system_off
  alias: "阳光模拟-全局关闭"
  description: "关闭FS-300B电源插座"
  trigger:
    - platform: state
      entity_id: input_boolean.sunlight_system_off
      to: "on"
  condition: []
  action:
    - service: switch.turn_off
      target: {entity_id: switch.huawei_socket_fs300b}
    - service: input_boolean.turn_off
      target: {entity_id: input_boolean.sunlight_system_off}
  mode: single

# ------------------------------------------------------------
# 新增：系统启动时自动执行滑轨+云台寻零
# 避免每次断电重启都要手动点两次寻零按钮
# ------------------------------------------------------------
- id: sunlight_auto_home_on_boot
  alias: "阳光模拟-开机自动寻零"
  trigger:
    - platform: homeassistant
      event: start
  condition: []
  action:
    - delay: "00:00:30"   # 等ESP32联网稳定
    - service: button.press
      target: {entity_id: button.执行寻零}
    - delay: "00:00:15"
    - service: button.press
      target: {entity_id: button.执行云台寻零}
  mode: single
