# ------------------------------------------------------------
# 场景4：电视模拟自然窗 - 电视旁窄光束
# ------------------------------------------------------------
- id: sunlight_scene_tv_window
  alias: "阳光模拟-场景4-电视模拟窗"
  description: "滑轨移到电视旁，灯头下倾45°偏向侧墙，20°窄光束；灯光由App预设约3500K 40%"
  trigger:
    - platform: state
      entity_id: input_boolean.scene_tv_window
      to: "on"
    - platform: time
      at: "19:00:00"
  condition: []
  action:
    - service: switch.turn_on
      target: {entity_id: switch.huawei_socket_fs300b}
    - delay: "00:00:03"
    - service: number.set_value
      target: {entity_id: number.slider_target}
      data: {value: 3450}
    - service: number.set_value
      target: {entity_id: number.gimbal_pitch_angle}
      data: {value: 45}
    - service: number.set_value
      target: {entity_id: number.gimbal_yaw_angle}
      data: {value: -30}
    - service: number.set_value
      target: {entity_id: number.gimbal_fresnel_angle}
      data: {value: 20}
    - service: input_boolean.turn_off
